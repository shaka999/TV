plugins {
    id 'com.android.library' version '8.12.3'
}

android {
    namespace 'androidx.media3.mpvplayer'
    compileSdk 36

    defaultConfig {
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 自编译的 FongMi 定制 media3 aar（compileOnly 提供编译期类型；运行时由 TV app/libs 提供同源 aar）
    // 由 build-media3 workflow 在编译前从 /tmp/aars 拷贝到本工程 libs/
    compileOnly files('libs/lib-common-release.aar')
    compileOnly files('libs/lib-exoplayer-release.aar')
    compileOnly files('libs/lib-datasource-release.aar')
    compileOnly files('libs/lib-ui-release.aar')
    // compileOnly 不传递依赖，androidx.annotation（@Nullable 等）需显式声明，
    // 否则 AGP 的 extractReleaseAnnotations 会因找不到注解而失败。
    compileOnly 'androidx.annotation:annotation:1.7.0'
}
