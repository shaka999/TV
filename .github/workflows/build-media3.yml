name: Build Custom Media3
# 编译 FongMi 定制 media3（release-1.10.1-fongmi）+ MPV 空实现 stub，产出 aar 发布到 Release。
# 手动触发或每周一自动；TV 主构建依赖此 Release 的 aar。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # 每周一 UTC 06:00（北京时间 14:00）

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出定制 media3
        uses: actions/checkout@v4
        with:
          repository: FongMi/media
          ref: release-1.10.1-fongmi
          path: media
          fetch-depth: 1

      - name: 检出 TV fork（取 mpv-stub 工程）
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: fongmi-6
          path: tv

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 补装 SDK Platform 36 + NDK + CMake（FFmpeg native 软解）
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          # FFmpeg 软解 native 依赖：NDK（官方 README 测试过 r26b）+ CMake 3.21+
          yes | sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null 2>&1 || true
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: 构建 FFmpeg native（软解，armeabi-v7a + arm64-v8a）
        # 按官方 decoder_ffmpeg README：clone FFmpeg → build_ffmpeg.sh 编静态库 → gradle 自动链接
        # 用 FongMi 自己的 release-8.1-fongmi 定制分支（与其定制 media3 配套，无 release/6.0 分支）
        # 全量 FFmpeg 仓库很大，用 --depth=1 只拉该分支
        run: |
          FFMPEG_MODULE_PATH="$(pwd)/media/libraries/decoder_ffmpeg/src/main"
          cd "${FFMPEG_MODULE_PATH}/jni"
          git clone --depth=1 --branch=release-8.1-fongmi https://github.com/FongMi/FFmpeg.git ffmpeg 2>&1 | tail -3
          if [ ! -f ffmpeg/configure ]; then echo "!! FFmpeg clone 失败"; exit 1; fi
          ls ffmpeg/ | head -3
          echo "FFmpeg 源码就绪"
          NDK_PATH="$ANDROID_NDK_HOME"
          echo "NDK: $NDK_PATH"
          chmod +x build_ffmpeg.sh
          # 通用软解解码器集合（音频 + 视频，覆盖主流格式）
          ENABLED_DECODERS=(aac ac3 eac3 mp3 vorbis opus flac pcm_alaw pcm_mulaw pcm_s16le \
                            h264 hevc mpeg2video mpeg4 vp8 vp9 av1 wmav2 mjpeg)
          # ABI 参数必须用 21（build_ffmpeg.sh 按 ABI 拼 clang 名：armv7a-linux-androideabi{ABI}-clang，
          # NDK 只有 -21-clang；官方 README 亦说明 ANDROID_ABI<21 时用 r23c，arm64 会自动升到 21）
          # 脚本一次运行会同时编 armeabi-v7a 与 arm64-v8a 两架构（内部两次 configure+make）
          ./build_ffmpeg.sh "${FFMPEG_MODULE_PATH}" "${NDK_PATH}" "linux-x86_64" 21 "${ENABLED_DECODERS[@]}" 2>&1 | tail -8
          echo "=== android-libs 产出 ==="
          ls "${FFMPEG_MODULE_PATH}/jni/ffmpeg/android-libs/" 2>/dev/null || { echo "!! android-libs 未生成"; exit 1; }

      - name: 打补丁：补齐 FongMi 私有 media3 API（C/CaptionStyleCompat/SubtitleView/PlayerView/ExoPlayer/DefaultRenderersFactory）
        run: |
          python3 tv/.fongmi6/scripts/patch-media3.py media/

      - name: 编译定制 media3 模块
        working-directory: media
        run: |
          chmod +x gradlew
          ./gradlew \
            :lib-common:assembleRelease \
            :lib-exoplayer:assembleRelease \
            :lib-exoplayer-hls:assembleRelease \
            :lib-exoplayer-dash:assembleRelease \
            :lib-exoplayer-rtsp:assembleRelease \
            :lib-exoplayer-smoothstreaming:assembleRelease \
            :lib-datasource:assembleRelease \
            :lib-datasource-okhttp:assembleRelease \
            :lib-database:assembleRelease \
            :lib-container:assembleRelease \
            :lib-decoder:assembleRelease \
            :lib-decoder-ffmpeg:assembleRelease \
            :lib-extractor:assembleRelease \
            :lib-effect:assembleRelease \
            :lib-session:assembleRelease \
            :lib-ui:assembleRelease \
            :lib-ui-danmaku:assembleRelease \
            --no-daemon -x lint -x test

      - name: 收集 media3 aar
        run: |
          mkdir -p /tmp/aars
          # 注意：media 仓库 gradle.properties 设了 buildDir=buildout，输出在 buildout/outputs/aar
          find media/libraries -path '*/outputs/aar/*-release.aar' -exec cp {} /tmp/aars/ \;
          echo "media3 aar 数量: $(ls /tmp/aars/*.aar 2>/dev/null | wc -l)"

      - name: 编译 MPV 空实现 stub
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'
      - run: |
          cd tv/.fongmi6/patches/mpv-stub
          # stub 编译需要定制 media3 的 compileOnly 类型（PlayerSeekView/DecodeTrackSelector 等用到 lib-ui/exoplayer/datasource）
          mkdir -p libs
          cp /tmp/aars/lib-common-release.aar /tmp/aars/lib-exoplayer-release.aar \
             /tmp/aars/lib-datasource-release.aar /tmp/aars/lib-ui-release.aar libs/
          gradle assembleRelease --no-daemon --stacktrace
          cp build/outputs/aar/*.aar /tmp/aars/mpvplayer-stub-release.aar

      - name: 计算版本标签
        id: tag
        run: echo "name=media3-1.10.1-fongmi-$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: 发布 aar 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Custom Media3 ${{ steps.tag.outputs.name }}
          body: |
            FongMi 定制 media3 (release-1.10.1-fongmi) + MPV 空实现 stub 的自编译 aar。
            供 fongmi-6 分支 build-tv workflow 下载到 app/libs 使用。
            包含 FFmpeg native 软解（armeabi-v7a + arm64-v8a，H.264/HEVC/MP3/AAC 等）。
          files: /tmp/aars/*.aar

      - name: 自动触发 TV 主构建（出 APK）
        run: gh workflow run build-tv.yml --ref fongmi-6 -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
