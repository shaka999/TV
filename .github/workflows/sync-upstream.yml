name: Sync Upstream FongMi
# 手动触发：需要同步上游 fongmi 分支时，在 Actions 页面点 Run workflow。
# 只做同步，不自动触发任何构建。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 fongmi 追踪分支
        uses: actions/checkout@v4
        with:
          ref: fongmi
          fetch-depth: 0

      - name: 合并上游 fongmi
        run: |
          git remote add upstream https://github.com/FongMi/TV.git 2>/dev/null || true
          git fetch upstream fongmi
          if git diff --quiet upstream/fongmi HEAD --; then
            echo "无上游更新，无需同步"
          else
            git merge --ff-only upstream/fongmi
            git push origin fongmi
            echo "✅ 已同步上游 fongmi 分支"
          fi
