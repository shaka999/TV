name: Build TV (Android 6.0.1)
# fongmi-6 主构建：merge 追踪分支 → 应用构建层补丁 → 拉 aar → 编 APK → 发布 Release
on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-synced]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 fongmi-6
        uses: actions/checkout@v4
        with:
          ref: fongmi-6
          fetch-depth: 0

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 补装 SDK Platform 37（上游 compileSdk=37）
        run: yes | sdkmanager "platforms;android-37" "build-tools;37.0.0" >/dev/null 2>&1 || true

      - name: 合并追踪分支最新代码
        run: |
          git fetch origin fongmi
          if git merge --no-edit origin/fongmi; then
            echo "✅ 已合并 fongmi 追踪分支"
          else
            echo "!! merge 冲突（构建层补丁与上游冲突），请人工检查"
            git merge --abort
            exit 1
          fi

      - name: 应用构建层补丁
        run: bash .fongmi6/patches/apply-patches.sh

      - name: 配置签名
        run: bash .fongmi6/scripts/setup-signing.sh
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: 拉取自编译 media3 + MPV stub aar
        run: bash .fongmi6/scripts/fetch-media3.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建 APK（leanback armv7 + arm64）
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLeanbackArmeabi_v7aRelease :app:assembleLeanbackArm64_v8aRelease \
            --no-daemon -x lint

      - name: 收集 APK
        run: |
          mkdir -p /tmp/apks
          # FongMi 自定义了 APK 命名（leanback-armeabi_v7a.apk，无 -release 后缀），匹配所有 apk
          find app/build/outputs/apk -name '*.apk' -exec cp {} /tmp/apks/ \;
          ls -la /tmp/apks/

      - name: 计算版本标签
        id: ver
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "tag=v${VER}-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
          echo "ver=$VER" >> $GITHUB_OUTPUT

      - name: 推送到 4.0.7 软件内升级通道（fongmi-4.0.7/apk/release/）
        # 不发布到 GitHub Release；改为推到 fongmi-4.0.7 分支的 apk/release/ 目录，
        # 已装的 4.0.7 软件点"检查更新"时能检测到并下载安装
        # 所需 Secrets：UPSTREAM_PAT（推荐，用 PAT；GITHUB_TOKEN 跨分支可能被拒）
        run: bash .fongmi6/scripts/push-update-channel.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_PAT: ${{ secrets.UPSTREAM_PAT }}
